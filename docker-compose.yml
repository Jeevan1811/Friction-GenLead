services:
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - research
  research:
    build: ./services/research
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/internal/health"]
      interval: 30s
      timeout: 10s
      retries: 3
