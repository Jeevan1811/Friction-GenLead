services:
  searxng:
    image: searxng/searxng:2026.5.9-0cba32c15
    container_name: frictiongenlead-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:3128:8080"
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:3128/"
    volumes:
      - /opt/frictiongenlead/search-runtime/searxng-settings.yml:/etc/searxng/settings.yml:ro
      - /tmp:size=64m
      - /var/cache/searxng:size=128m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 192
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
